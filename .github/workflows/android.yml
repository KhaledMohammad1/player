name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name player --org com.yalkhodary app
          mkdir -p app/lib
          cp -R lib/. app/lib/

      - name: Install dependencies
        working-directory: app
        run: |
          flutter pub add flutter_riverpod media_kit media_kit_video media_kit_libs_android_video path_provider path file_picker:^10.0.0 audio_service audio_session liquid_design:^0.4.1 audio_metadata_reader video_thumbnail
          flutter pub get

      - name: Patch legacy video_thumbnail Android repository
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching Flutter package cache for obsolete jcenter() declarations..."
          mapfile -t gradle_files < <(grep -RIl --include='build.gradle' 'jcenter()' "$HOME/.pub-cache" 2>/dev/null || true)
          patched=0
          for file in "${gradle_files[@]}"; do
            if [[ "$file" == *video_thumbnail* ]]; then
              echo "Patching $file"
              sed -i 's/jcenter()/mavenCentral()/g' "$file"
              patched=$((patched + 1))
            fi
          done
          if [[ "$patched" -eq 0 ]]; then
            plugin_file="$(find "$HOME/.pub-cache" -type f -path '*video_thumbnail*/android/build.gradle' -print -quit)"
            if [[ -z "$plugin_file" ]]; then
              echo "ERROR: video_thumbnail Gradle file not found"
              exit 1
            fi
            echo "Patching exact plugin file: $plugin_file"
            sed -i 's/jcenter()/mavenCentral()/g' "$plugin_file"
          fi
          if grep -RIn --include='build.gradle' 'jcenter()' "$HOME/.pub-cache" 2>/dev/null | grep 'video_thumbnail'; then
            echo "ERROR: obsolete jcenter() declaration remains"
            exit 1
          fi
          echo "Verified: no jcenter() remains in video_thumbnail Gradle files."
          # Patch the actual plugin module, not the example app's Gradle file.
          plugin_gradle="$(find "$HOME/.pub-cache/hosted/pub.dev" -type f -path '*/video_thumbnail-*/android/build.gradle' ! -path '*/example/*' -print -quit)"
          if [[ -z "$plugin_gradle" ]]; then
            echo "ERROR: video_thumbnail Android build.gradle not found"
            exit 1
          fi
          echo "Patching plugin module: $plugin_gradle"
          sed -i 's/jcenter()/mavenCentral()/g' "$plugin_gradle"
          sed -i -E 's/compileSdkVersion[[:space:]]+33/compileSdkVersion 35/g; s/compileSdk[[:space:]]*=[[:space:]]*33/compileSdk = 35/g' "$plugin_gradle"
          grep -nE 'compileSdk(Version)?' "$plugin_gradle"
          if ! grep -Eq 'compileSdkVersion[[:space:]]+35|compileSdk[[:space:]]*=[[:space:]]*35' "$plugin_gradle"; then
            echo "ERROR: failed to update video_thumbnail compileSdk to 35"
            exit 1
          fi
          if grep -q 'jcenter()' "$plugin_gradle"; then
            echo "ERROR: obsolete jcenter() remains in video_thumbnail"
            exit 1
          fi
          echo "Verified video_thumbnail uses compileSdk 35 and mavenCentral()."

      - name: Build ARM APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Player-Android-APKs
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
